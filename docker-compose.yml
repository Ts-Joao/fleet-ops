services:
  postgres:
    image: postgres:17
    container_name: fleet-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - fleet-db-data:/var/lib/postgresql/data
    restart: always

volumes:
  fleet-db-data: {}