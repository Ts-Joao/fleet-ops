services:
  postgres:
    image: postgres:17
    container_name: fleet-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - fleet-db-data:/var/lib/postgresql/data

  volumes:
  - fleet-db-data